---
name: ✨ 功能需求
description: 提交新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述清楚功能需求与使用场景。
        提交前请先在 [Issues](https://github.com/skyfireitdiy/Jarvis/issues)
        中搜索是否已有相同需求。
  - type: textarea
    id: problem
    attributes:
      label: 问题 / 背景
      description: 这个功能解决什么问题？当前遇到了什么不便？
      placeholder: "在使用 Jarvis 时，我遇到了……"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的功能
      description: 你希望 Jarvis 提供什么样的功能或行为？
      placeholder: "我希望 Jarvis 能够……"
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 描述该功能的使用场景与目标用户
      placeholder: "例如：开发者在使用……时，需要……"
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否有其他替代方案或变通做法？
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他有助于理解需求的信息（如参考其他项目的实现等）
