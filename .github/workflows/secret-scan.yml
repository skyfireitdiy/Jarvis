---
# 凭据拦截器（CI 版）
#
# 目的：在 GitHub Actions 上拦截被推送/提交的敏感凭据（API key、token、私钥、
# 硬编码口令等），与本地提交前钩子 .githooks/pre-commit 形成「本地 + 远端」双保险。
#
# 与本地钩子复用同一套规则，避免规则漂移：
#   1) Gitleaks：使用仓库根 .gitleaks.toml（与本地钩子同配置）。
#   2) 自研扫描器：scripts/scan_secrets_ci.py → 复用
#      src/jarvis/jarvis_agent/share_secret_scanner.py 的规则，
#      补充 Gitleaks 默认规则未覆盖的「通用赋值型口令」。
#
# 扫描范围：
#   - pull_request：相对 base 分支的变更（origin/<base>...HEAD）
#   - push：本次推送的提交区间（before..after）
#   - workflow_dispatch：可手动指定范围，默认全历史（--all）
#
# 命中即 job 失败，阻断合并/发布。报告一律脱敏，绝不打印完整凭据。
name: Secret Scan

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scan_all_history:
        description: "扫描全部 git 历史（默认只扫本次变更）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks 扫描
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 需要完整历史以计算变更范围 / 全历史扫描
          fetch-depth: 0

      - name: 安装 Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fSL --retry 3 -o /tmp/gitleaks.tar.gz "$url"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: 计算扫描范围
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          SCAN_ALL: ${{ github.event.inputs.scan_all_history }}
        run: |
          set -euo pipefail
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "${SCAN_ALL}" = "true" ]; then
            echo "log_opts=--all" >> "$GITHUB_OUTPUT"
            echo "diff_range=" >> "$GITHUB_OUTPUT"
            echo "扫描范围：全部历史"
          elif [ "${EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags origin "${BASE_REF}" || true
            echo "log_opts=origin/${BASE_REF}...HEAD" >> "$GITHUB_OUTPUT"
            echo "diff_range=origin/${BASE_REF}...HEAD" >> "$GITHUB_OUTPUT"
            echo "扫描范围：origin/${BASE_REF}...HEAD"
          elif [ "${EVENT_NAME}" = "push" ] && [ -n "${BEFORE_SHA}" ] \
            && [ "${BEFORE_SHA}" != "${ZERO_SHA}" ]; then
            echo "log_opts=${BEFORE_SHA}..${AFTER_SHA}" >> "$GITHUB_OUTPUT"
            echo "diff_range=${BEFORE_SHA}..${AFTER_SHA}" >> "$GITHUB_OUTPUT"
            echo "扫描范围：${BEFORE_SHA}..${AFTER_SHA}"
          else
            echo "log_opts=HEAD~1..HEAD" >> "$GITHUB_OUTPUT"
            echo "diff_range=HEAD~1..HEAD" >> "$GITHUB_OUTPUT"
            echo "扫描范围：HEAD~1..HEAD（兜底）"
          fi

      - name: Gitleaks 扫描
        run: |
          set -euo pipefail
          log_opts='${{ steps.range.outputs.log_opts }}'
          report="gitleaks-report.json"
          if [ "$log_opts" = "--all" ]; then
            log_opts="--all"
          fi
          gitleaks git --no-banner --redact=20 --config .gitleaks.toml \
            --log-opts="$log_opts" \
            --report-format json --report-path "$report" .

      - name: 上传 Gitleaks 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

  custom-scanner:
    name: 自研规则扫描（通用口令）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 计算扫描范围
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          SCAN_ALL: ${{ github.event.inputs.scan_all_history }}
        run: |
          set -euo pipefail
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "${SCAN_ALL}" = "true" ]; then
            # 全历史：用首个提交到 HEAD 的范围
            first="$(git rev-list --max-parents=0 HEAD | tail -1)"
            echo "diff_range=${first}..HEAD" >> "$GITHUB_OUTPUT"
            echo "扫描范围：${first}..HEAD（全历史）"
          elif [ "${EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags origin "${BASE_REF}" || true
            echo "diff_range=origin/${BASE_REF}...HEAD" >> "$GITHUB_OUTPUT"
            echo "扫描范围：origin/${BASE_REF}...HEAD"
          elif [ "${EVENT_NAME}" = "push" ] && [ -n "${BEFORE_SHA}" ] \
            && [ "${BEFORE_SHA}" != "${ZERO_SHA}" ]; then
            echo "diff_range=${BEFORE_SHA}..${AFTER_SHA}" >> "$GITHUB_OUTPUT"
            echo "扫描范围：${BEFORE_SHA}..${AFTER_SHA}"
          else
            echo "diff_range=HEAD~1..HEAD" >> "$GITHUB_OUTPUT"
            echo "扫描范围：HEAD~1..HEAD（兜底）"
          fi

      - name: 自研规则扫描
        run: |
          python3 scripts/scan_secrets_ci.py \
            "${{ steps.range.outputs.diff_range }}"
