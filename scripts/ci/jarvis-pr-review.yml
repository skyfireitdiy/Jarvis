---
# yamllint disable rule:line-length
# =============================================================================
# Jarvis PR 自动审查工作流模板
# -----------------------------------------------------------------------------
# 用途：PR 触发时，用 Jarvis CodeAgent 对 git diff 做代码审查，并把结构化
#       审查结论作为 PR 评论发布。
#
# 用法：
#   1. 把本文件复制到你的仓库 .github/workflows/jarvis-pr-review.yml
#   2. 配置环境变量（Jarvis 从标准 LLM 环境变量读取 API Key，见下）：
#      - OPENAI_API_KEY     （OpenAI 平台）调用 LLM 的 API Key
#      - ANTHROPIC_API_KEY  （Anthropic 平台）调用 LLM 的 API Key
#      - OPENAI_API_BASE    （可选）自定义 OpenAI 兼容端点
#      - JARVIS_MODEL       （可选）指定模型，默认 gpt-5
#      - JARVIS_PLATFORM    （可选）指定平台，默认 openai
#      - JARVIS_REVIEW_RULES （可选）附加审查规则，逗号分隔
#   3. 授予工作流 pull-requests: write 权限（用于发布审查评论）
#
#   说明：Jarvis 首次运行会自动生成默认配置（无交互），API Key 通过标准
#        环境变量（OPENAI_API_KEY / ANTHROPIC_API_KEY）注入，无需预置 config.yaml。
#        也可用 jqc 非交互模式持久化配置：jqc --platform openai --base-url <url>
#        --api-key <key> --model <model> --skip-test（写入 ~/.jarvis/config.yaml）。
# 原理：复用 Jarvis headless 非交互模式（jvs -n -T），配合 --task-file 的
#       status_file 机制拿到结构化输出，再解析 .output 文件作为评论内容。
# =============================================================================
name: Jarvis PR Review

"on":
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  jarvis-pr-review:
    name: Jarvis Code Review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Jarvis
        run: |
          pip install --upgrade pip
          # 从 PyPI 安装 Jarvis（jarvis-ai-assistant），适用于任意用户仓库
          pip install jarvis-ai-assistant

      - name: Compute PR diff
        id: diff
        run: |
          # 生成 PR 变更的 diff，供 Jarvis 审查
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > /tmp/pr.diff || true
          echo "diff_lines=$(wc -l < /tmp/pr.diff)" >> "$GITHUB_OUTPUT"

      - name: Prepare Jarvis task file
        id: task
        run: |
          # 构建 --task-file JSON：含 task_desc / background / status_file
          cat > /tmp/jarvis-task.json <<'EOF'
          {
            "task_desc": "请对本次 PR 的代码变更进行专业代码审查。输出结构化结论：1) 问题清单（每个问题标注严重级别 critical/warning/info 与文件位置）；2) 改进建议；3) 总体结论（approve 或 request_changes）。",
            "background": "这是 GitHub Actions 中 Jarvis 自动审查。请审查 /tmp/pr.diff 中的 diff 内容，结合仓库上下文给出可执行的审查意见。",
            "status_file": "/tmp/jarvis-status.json"
          }
          EOF

      - name: Run Jarvis review (headless)
        id: jarvis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          JARVIS_MODEL: ${{ secrets.JARVIS_MODEL }}
          JARVIS_PLATFORM: ${{ secrets.JARVIS_PLATFORM }}
          JARVIS_REVIEW_RULES: ${{ vars.JARVIS_REVIEW_RULES }}
          # 跳过首次运行的交互式配置引导（CI 环境无 TTY）
          JARVIS_SKIP_INTERACTIVE_CONFIG: "1"
        run: |
          # 非交互模式执行审查；状态写入 status_file，输出写入 .output
          jvs -n --task-file /tmp/jarvis-task.json --rule-names "code_review${JARVIS_REVIEW_RULES:+,$JARVIS_REVIEW_RULES}" || true

      - name: Read Jarvis review result
        id: result
        run: |
          # 读取状态文件与输出
          if [ -f /tmp/jarvis-status.json ]; then
            echo "status=$(jq -r '.status' /tmp/jarvis-status.json)" >> "$GITHUB_OUTPUT"
          fi
          if [ -f /tmp/jarvis-status.output ]; then
            {
              echo "output<<EOF"
              cat /tmp/jarvis-status.output
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Post review comment
        if: steps.result.outputs.output != ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## 🤖 Jarvis 代码审查结果',
              '',
              '> 状态：' + (process.env.REVIEW_STATUS || 'unknown'),
              '',
              '```',
              process.env.REVIEW_OUTPUT || '(无输出)',
              '```'
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
        env:
          REVIEW_STATUS: ${{ steps.result.outputs.status }}
          REVIEW_OUTPUT: ${{ steps.result.outputs.output }}
