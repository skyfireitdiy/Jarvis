---
# yamllint disable rule:line-length
# =============================================================================
# Jarvis CI 测试工作流模板
# -----------------------------------------------------------------------------
# 用途：push/PR 触发时，先用 Jarvis 跑测试并汇报结果，再可选跑标准 pytest。
#       相比纯 pytest 流程，Jarvis 能自动分析测试失败、定位根因并给出修复建议。
#
# 用法：
#   1. 把本文件复制到你的仓库 .github/workflows/jarvis-ci-test.yml
#   2. 配置环境变量（Jarvis 从标准 LLM 环境变量读取 API Key，见下）：
#      - OPENAI_API_KEY     （OpenAI 平台）调用 LLM 的 API Key
#      - ANTHROPIC_API_KEY  （Anthropic 平台）调用 LLM 的 API Key
#      - OPENAI_API_BASE    （可选）自定义 OpenAI 兼容端点
#      - JARVIS_MODEL       （可选）指定模型，默认 gpt-5
#      - JARVIS_PLATFORM    （可选）指定平台，默认 openai
#   3. 按需调整 TEST_COMMAND（默认 pytest -v）
#
#   说明：Jarvis 首次运行会自动生成默认配置（无交互），API Key 通过标准
#        环境变量（OPENAI_API_KEY / ANTHROPIC_API_KEY）注入，无需预置 config.yaml。
#        也可用 jqc 非交互模式持久化配置：jqc --platform openai --base-url <url>
#        --api-key <key> --model <model> --skip-test（写入 ~/.jarvis/config.yaml）。
# 原理：复用 Jarvis headless 非交互模式（jvs -n --task-file），把测试命令
#       交给 Jarvis 执行并分析结果，输出结构化汇报。
# =============================================================================
name: Jarvis CI Test

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  jarvis-ci-test:
    name: Jarvis CI Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 从 PyPI 安装 Jarvis（jarvis-ai-assistant），适用于任意用户仓库
          pip install jarvis-ai-assistant

      - name: Prepare Jarvis task file
        id: task
        env:
          TEST_COMMAND: ${{ vars.JARVIS_TEST_COMMAND || 'pytest -v' }}
        run: |
          cat > /tmp/jarvis-task.json <<'EOF'
          {
            "task_desc": "请在当前仓库运行测试命令并分析结果。输出结构化汇报：1) 测试命令；2) 通过/失败统计；3) 若失败，列出失败用例、定位根因并给出修复建议；4) 总体结论（pass 或 fail）。",
            "background": "这是 GitHub Actions 中 Jarvis CI 测试。测试命令为：${TEST_COMMAND}。请先运行命令，再基于输出分析结果。",
            "status_file": "/tmp/jarvis-status.json"
          }
          EOF

      - name: Run Jarvis test (headless)
        id: jarvis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          JARVIS_MODEL: ${{ secrets.JARVIS_MODEL }}
          JARVIS_PLATFORM: ${{ secrets.JARVIS_PLATFORM }}
          # 跳过首次运行的交互式配置引导（CI 环境无 TTY）
          JARVIS_SKIP_INTERACTIVE_CONFIG: "1"
        run: |
          jvs -n --task-file /tmp/jarvis-task.json || true

      - name: Read Jarvis test result
        id: result
        run: |
          if [ -f /tmp/jarvis-status.json ]; then
            echo "status=$(jq -r '.status' /tmp/jarvis-status.json)" >> "$GITHUB_OUTPUT"
          fi
          if [ -f /tmp/jarvis-status.output ]; then
            {
              echo "output<<EOF"
              cat /tmp/jarvis-status.output
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Post test report comment
        if: steps.result.outputs.output != '' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## 🤖 Jarvis CI 测试报告',
              '',
              '> 状态：' + (process.env.TEST_STATUS || 'unknown'),
              '',
              '```',
              process.env.TEST_OUTPUT || '(无输出)',
              '```'
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
        env:
          TEST_STATUS: ${{ steps.result.outputs.status }}
          TEST_OUTPUT: ${{ steps.result.outputs.output }}
