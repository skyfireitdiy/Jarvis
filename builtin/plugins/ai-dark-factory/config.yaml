---
name: ai-dark-factory
description: AI Agent 黑灯工厂——Specs 进，可工作的软件出。多 Agent 自主写码/测试/评估，人类审 pass/fail 报告。
version: 0.1.0
builtin: true
license: MIT
rules_load_dirs:
  - "{{plugin_dir}}/rules"
tool_load_dirs:
  - "{{plugin_dir}}/tools"
orchestration:
  - name: dark-factory-pipeline
    description: AI 黑灯工厂编排流水线——Specs 进，可工作的软件出
    file: "{{plugin_dir}}/orchestration/dark_factory_pipeline.yaml"
replace_map:
  dark-factory/run:
    append: false
    template: |
      请使用 AI 黑灯工厂流水线自动完成以下开发（用内置编排引擎 pipeline_runner 驱动）。
      ## 你必须遵守的规则
      - **必须**：先确认 NLSpec 已就绪（四要素完整），否则用 spec_validator 补全。
      - **必须**：遵守 spec_writing / tdd_iron_rule / orchestration /
        holdout_discipline 规则。
      - **必须**：编排文件是每次任务动态生成的「结构化 plan」：根据 spec 与
        代码库现状，和用户共同讨论出编排文件（agents + flow），用户确认后再执行。
      - **必须**：在已有代码库中工作——generator 直接修改现有代码，不生成到独立目录。
      - **必须**：门禁阶段停住，把审批报告交人工审批，不自动合并。
      - **禁止**：没有 Spec 就开始实现；未经用户确认就执行编排；未经人工审批自动放行门禁。
      ## 你必须执行的操作
      1. 确认/补全 NLSpec（spec_file），必要时用 spec_validator 校验。
      2. 与用户讨论，动态生成编排文件（含 agents + flow，参考插件自带
        orchestration/dark_factory_pipeline.yaml 模板），落盘到 .df/pipeline.yaml，
        用户确认编排文件无误。
      3. 调用 pipeline_runner 工具，参数：
         - orchestration_file=<动态生成的编排文件路径>
         - spec_file=<NLSpec 路径>
         - working_dir=<工作目录>
         - approve=false（门禁停住，等人工审批）
      4. 流水线跑完后，把审批报告路径与各阶段结果呈现给用户，交人工审批。
      5. 人工审批通过后（approve=true 重跑门禁确认）再决定是否提交/合并。
    description: 用内置编排引擎跑完整黑灯工厂流水线
  dark-factory/issue:
    append: false
    template: |
      请使用 AI 黑灯工厂工作流开发以下需求（来自 GitHub Issue）。
      ## 你必须遵守的规则
      - **必须**：先读取并理解 Issue，把需求转成合格的 NLSpec
        （Goal/Constraints/Interfaces/Non-goals 四要素）。
      - **必须**：遵守 spec_writing / tdd_iron_rule / orchestration /
        holdout_discipline 规则。
      - **必须**：按 规划 → 生成隐藏场景 → 生成（TDD）→ 验证 → 回归 → 门禁
        六阶段推进，不跳阶段。
      - **必须**：编排文件是动态生成的「结构化 plan」，与用户讨论确认后再执行。
      - **必须**：在已有代码库中工作——generator 直接修改现有代码。
      - **必须**：holdout 场景只注入 validator，绝不注入 generator（隔离纪律）。
      - **必须**：门禁处输出结构化审批报告，交人工审批，不自动合并。
      - **禁止**：没有 Spec 就开始实现；未经用户确认就执行编排。
      ## 你必须执行的操作
      1. 用 `gh issue view <number>` 读取目标 Issue，提取需求。
      2. 用 spec_validator 工具校验/补全 NLSpec 四要素。
      3. 与用户讨论，动态生成编排文件（agents + flow，参考
        orchestration/dark_factory_pipeline.yaml 模板），落盘 .df/pipeline.yaml，
        用户确认无误。
      4. 调用 pipeline_runner 工具按 flow 顺序驱动六阶段流水线：
        planner 规划 → holdout 生成隐藏验收场景 → generator 写码（先写测试）
        → validator 用 holdout 评估（隔离）→ regression 跑既有测试防回归
        → orchestrator 计算门禁指标（gate 停住）。
      5. 产出审批报告后交人工确认；通过后如需提交，用 gh 提交 PR。
    description: 用黑灯工厂工作流开发 Issue 需求
  dark-factory/pr:
    append: false
    template: |
      请使用 AI 黑灯工厂工作流处理以下 GitHub Pull Request。
      ## 你必须遵守的规则
      - **必须**：先读取 PR 的 diff 与关联 Issue，理解改动目标。
      - **必须**：遵守 spec_writing / tdd_iron_rule / orchestration /
        holdout_discipline 规则。
      - **必须**：按 规划 → 生成隐藏场景 → 生成（TDD）→ 验证 → 回归 → 门禁
        六阶段推进。
      - **必须**：编排文件是动态生成的「结构化 plan」，与用户讨论确认后再执行。
      - **必须**：在已有代码库中工作——generator 直接修改现有代码。
      - **必须**：holdout 场景只注入 validator，绝不注入 generator（隔离纪律）。
      - **必须**：门禁处输出审批报告（各场景通过率、失败详情、
        改动 diff 摘要），交人工审批。
      - **禁止**：未经人工审批自动合并 PR；未经用户确认就执行编排。
      ## 你必须执行的操作
      1. 用 `gh pr view <number>` 读取 PR 详情，用 `gh pr diff <number>` 查看改动。
      2. 用 spec_validator 校验改动对应的 NLSpec 四要素是否完整。
      3. 与用户讨论，动态生成编排文件（agents + flow，参考
        orchestration/dark_factory_pipeline.yaml 模板），落盘 .df/pipeline.yaml，
        用户确认无误。
      4. 调用 pipeline_runner 工具按 flow 顺序驱动六阶段流水线：
        规划 → 生成隐藏场景 → 生成（补齐缺失实现/测试）→ 验证 → 回归 → 门禁（gate 停住）。
      5. 产出审批报告交人工确认；通过后如需合并，用 `gh pr merge <number>`（先与用户确认）。
    description: 用黑灯工厂工作流处理 PR
