---
name: gh
description: GitHub 助手——自动处理当前仓库的 PR 和 Issue，复用 GitHub 官方 gh CLI 登录态。
version: 0.1.0
builtin: true
license: MIT
rules_load_dirs:
  - "{{plugin_dir}}/rules"
frontend:
  sidebar_views:
    - id: gh
      title: "GitHub"
      entry: sidebar_view.js
      icon: frontend/icon.svg
dependencies:
  commands:
    - gh
capabilities:
  - name: "PR 管理"
    description: "列出/查看/合并当前仓库的 Pull Request"
  - name: "Issue 管理"
    description: "列出/查看/评论/关闭当前仓库的 Issue"
  - name: "前端 GitHub 侧边栏"
    description: "在编辑器侧边栏浏览/操作当前仓库的 Issue 与 PR（列表/详情/评论/关闭/合并）"
